# This workflow builds the Better Enchanted Books mod for Fabric 1.21.10
# 
# Important: This workflow specifically targets Minecraft version 1.21.10
# (NOT 1.21.1 - these are different versions)
#
# Triggers:
# - Manual dispatch via GitHub Actions UI
# - Push to branches: mc-1.21.10, mc-1.21.10-*
# - Pull requests to branches: mc-1.21.10, mc-1.21.10-*
#
# The workflow will:
# 1. Check out the repository
# 2. Set up Java 21 (required for Minecraft 1.21+)
# 3. Temporarily update gradle.properties with 1.21.10-specific versions
# 4. Build the mod
# 5. Upload the built JAR files as artifacts
# 6. Restore the original gradle.properties

name: Build for Fabric 1.21.10

on:
  workflow_dispatch:
  push:
    branches:
      - 'mc-1.21.10'
      - 'mc-1.21.10-*'
  pull_request:
    branches:
      - 'mc-1.21.10'
      - 'mc-1.21.10-*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Update gradle.properties for Fabric 1.21.10
        run: |
          # Backup original gradle.properties
          cp gradle.properties gradle.properties.bak
          
          # Update versions for Minecraft 1.21.10
          sed -i 's/minecraft_version=.*/minecraft_version=1.21.10/' gradle.properties
          sed -i 's/yarn_mappings=.*/yarn_mappings=1.21.10+build.1/' gradle.properties
          sed -i 's/loader_version=.*/loader_version=0.16.9/' gradle.properties
          sed -i 's/fabric_version=.*/fabric_version=0.110.5+1.21.10/' gradle.properties
          sed -i 's/modmenu_version=.*/modmenu_version=12.0.0/' gradle.properties
          sed -i 's/cloth_config_version=.*/cloth_config_version=16.0.127/' gradle.properties
          sed -i 's/archives_minecraft_version=.*/archives_minecraft_version=1.21.10/' gradle.properties
          sed -i 's/java_version=.*/java_version=21/' gradle.properties
          sed -i 's/minecraft_version_range=.*/minecraft_version_range=~1.21.10/' gradle.properties
          sed -i 's/fabric_loader_range=.*/fabric_loader_range=>=0.16/' gradle.properties
          
          echo "Updated gradle.properties:"
          cat gradle.properties
      
      - name: Build with Gradle
        run: ./gradlew clean build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: better-enchanted-books-fabric-1.21.10
          path: build/libs/*.jar
          if-no-files-found: error
      
      - name: Restore original gradle.properties
        if: always()
        run: |
          if [ -f gradle.properties.bak ]; then
            mv gradle.properties.bak gradle.properties
          fi
